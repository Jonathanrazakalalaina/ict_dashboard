<style>
  :root {
    --unfpa-blue: #0b6cb3;
    --unfpa-blue-dark: #084d82;
  }

  html, body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

  #app { font-family: 'Inter', sans-serif; }

  .v-application { font-family: 'Inter', sans-serif !important; }

  .app-loader { position: fixed; top: 0; left: 0; right: 0; z-index: 3000; }

  .app-drawer .v-list-item--active {
    background: rgba(11,108,179,0.12);
    color: var(--unfpa-blue);
    font-weight: 600;
  }
  .app-drawer .v-list-item--active .v-icon { color: var(--unfpa-blue); }

  .drawer-brand { min-height: 64px; }

  .app-topbar { border-bottom: 1px solid rgba(128,128,128,0.15) !important; }

  .search-field .v-field { border-radius: 10px; }

  .app-main { background: rgb(var(--v-theme-background)); min-height: 100vh; }

  .kpi-card {
    border-radius: 16px !important;
    transition: transform .18s ease, box-shadow .18s ease;
    border: 1px solid rgba(128,128,128,0.12);
  }
  .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.08) !important; }

  .kpi-icon-box {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  .section-card { border-radius: 16px !important; border: 1px solid rgba(128,128,128,0.12); }

  .rounded-chip { border-radius: 8px !important; }

  .table-card .v-table { border-radius: 16px; }

  /* -----------------------------------------------------------
     Custom table (replaces Vuetify's <v-table> component, which
     has a rendering bug with slotted thead/tbody content that
     updates reactively). Styled to look identical, adapts to
     dark/light theme via Vuetify's CSS theme variables.
     ----------------------------------------------------------- */
  .custom-table-wrapper {
    overflow: auto;
    border-radius: 16px;
  }
  .custom-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }
  .custom-table thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: rgb(var(--v-theme-surface));
    text-align: left;
    padding: 12px 16px;
    font-weight: 600;
    font-size: 0.75rem;
    letter-spacing: 0.02em;
    color: rgba(var(--v-theme-on-surface), 0.6);
    border-bottom: 1px solid rgba(var(--v-theme-on-surface), 0.12);
    white-space: nowrap;
  }
  .custom-table tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(var(--v-theme-on-surface), 0.08);
    color: rgb(var(--v-theme-on-surface));
    vertical-align: middle;
  }
  .custom-table tbody tr:last-child td { border-bottom: none; }
  .custom-table tbody tr.is-clickable { cursor: pointer; }
  .custom-table tbody tr.is-clickable:hover {
    background: rgba(var(--v-theme-primary), 0.06);
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.35); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .fade-in { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  .search-results-card { border-radius: 16px !important; }

  .priority-critique { color: #d32f2f !important; }
  .priority-haute { color: #f57c00 !important; }
  .priority-moyenne { color: #fbc02d !important; }
  .priority-basse { color: #388e3c !important; }

  .kb-content {
    white-space: pre-wrap;
    line-height: 1.6;
  }

  .text-truncate-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .ticket-detail-drawer .v-navigation-drawer__content { padding-bottom: 24px; }

  .stat-trend-bar { border-radius: 6px 6px 0 0; }

  .brand-gradient {
    background: linear-gradient(135deg, var(--unfpa-blue) 0%, #1e88c7 100%);
  }
  .user-avatar {
    cursor: pointer;
    border: 2px solid rgba(var(--v-theme-primary), 0.15);
    transition: border-color 0.2s ease;
  }

  .user-avatar:hover {
    border-color: rgb(var(--v-theme-primary));
  }
  .article-rendered-content {
    line-height: 1.6;
  }
  .article-rendered-content p {
    margin: 0 0 0.75em 0; /* AJOUT : remplace la marge par défaut du navigateur */
  }
  .article-rendered-content p:last-child {
    margin-bottom: 0; /* évite un espace vide en bas du rendu */
  }
  .article-rendered-content h1 { font-size: 1.6rem; font-weight: 700; margin: 0.6em 0 0.4em; }
  .article-rendered-content h2 { font-size: 1.3rem; font-weight: 700; margin: 0.6em 0 0.4em; }
  .article-rendered-content ul, .article-rendered-content ol { padding-left: 1.4em; margin: 0.4em 0; }
  .article-rendered-content li { margin: 0.2em 0; }
  .article-rendered-content strong { font-weight: 700; }
  .article-rendered-content em { font-style: italic; }
  .article-rendered-content details { margin: 0.6em 0; padding: 0.4em 0.6em; border: 1px solid rgba(0,0,0,0.12); border-radius: 6px; }
  .article-rendered-content summary { cursor: pointer; font-weight: 600; }
  .article-rendered-content a { color: #0b6cb3; text-decoration: underline; }
  .article-rendered-content a:hover { text-decoration: none; }
</style>
